name: Build SkyMod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      PLUGIN_SDK_DIR: C:\plugin-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Get plugin-sdk
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git C:\plugin-sdk

      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build plugin-sdk library (GTA SA)
        run: msbuild C:\plugin-sdk\plugin_sa\plugin_sa.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:PLUGIN_SDK_DIR=C:\plugin-sdk\

      - name: Compile SkyMod.asi
        shell: cmd
        run: |
          dir /s /b C:\plugin-sdk\output\*.lib
          cl /nologo /LD /EHsc /MT /O2 /std:c++17 /DGTASA /DPLUGIN_SGV_10US /D_CRT_SECURE_NO_WARNINGS /DNOMINMAX ^
            /I"%PLUGIN_SDK_DIR%\plugin_sa" /I"%PLUGIN_SDK_DIR%\plugin_sa\game_sa" ^
            /I"%PLUGIN_SDK_DIR%\shared" /I"%PLUGIN_SDK_DIR%\shared\game" ^
            SkyMod.cpp /Fe:SkyMod.asi ^
            /link /LIBPATH:"%PLUGIN_SDK_DIR%\output\lib" plugin.lib user32.lib

      - uses: actions/upload-artifact@v4
        with:
          name: SkyMod
          path: SkyMod.asi
