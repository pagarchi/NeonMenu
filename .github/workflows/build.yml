name: Build SkyMod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      PLUGIN_SDK_DIR: C:\plugin-sdk\
      GTA_SA_DIR: C:\gta
      GTA_VC_DIR: C:\gta
      GTA_III_DIR: C:\gta
      GTA_II_DIR: C:\gta
      GTA_IV_DIR: C:\gta
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Get plugin-sdk
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git C:\plugin-sdk

      - name: Build latest premake from source
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/premake/premake-core.git C:\premake-src
          cd /d C:\premake-src
          nmake -f Bootstrap.mak MSDEV=vs2022 windows
          dir C:\premake-src\bin\release

      - name: Generate VS projects
        working-directory: C:\plugin-sdk\tools\premake
        run: |
          C:\premake-src\bin\release\premake5.exe vs2022
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem C:\plugin-sdk -Recurse -Filter *.vcxproj | ForEach-Object { $_.FullName }

      - name: Build plugin-sdk library (GTA SA)
        run: |
          $proj = Get-ChildItem C:\plugin-sdk -Recurse -Filter plugin_sa.vcxproj | Select-Object -First 1
          if (-not $proj) { Write-Host "plugin_sa.vcxproj not found"; exit 1 }
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Compile SkyMod.asi
        shell: pwsh
        run: |
          $d = "C:\plugin-sdk"
          $lib = Get-ChildItem $d -Recurse -Filter plugin.lib | Select-Object -First 1
          if (-not $lib) { Write-Host "plugin.lib not found"; exit 1 }
          Write-Host "Using lib: $($lib.FullName)"
          $defs = @(
            '#define TARGET_NAME "SkyMod"',
            '#define GTAGAME_NAME "San Andreas"',
            '#define GTAGAME_ABBR "SA"',
            '#define GTAGAME_ABBRLOW "sa"',
            '#define GTAGAME_PROTAGONISTNAME "CJ"',
            '#define GTAGAME_CITYNAME "San Andreas"'
          )
          Set-Content -Path C:\skymod_defs.h -Value $defs
          $inc = @("$d\plugin_sa", "$d\plugin_sa\game_sa", "$d\plugin_sa\game_sa\enums", "$d\plugin_sa\game_sa\rw", "$d\shared", "$d\shared\game") | ForEach-Object { "/I$_" }
          foreach ($crt in "/MT", "/MD") {
            Write-Host "=== Compiling with $crt"
            $out = & cl /nologo /LD /EHsc $crt /O2 /std:c++latest /FIC:\skymod_defs.h /DGTASA /DPLUGIN_SGV_10US /DRW /D_CRT_NON_CONFORMING_SWPRINTFS /D_CRT_SECURE_NO_WARNINGS @inc SkyMod.cpp /Fe:SkyMod.asi /link "/LIBPATH:$($lib.DirectoryName)" plugin.lib user32.lib 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -eq 0) { break }
            if ($out -notmatch "LNK2038") { break }
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path SkyMod.asi)) { Write-Host "SkyMod.asi not found"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SkyMod
          path: SkyMod.asi
