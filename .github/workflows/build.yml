name: Build SkyMod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      PLUGIN_SDK_DIR: C:\plugin-sdk\
      GTA_SA_DIR: C:\gta
      GTA_VC_DIR: C:\gta
      GTA_III_DIR: C:\gta
      GTA_II_DIR: C:\gta
      GTA_IV_DIR: C:\gta
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Get plugin-sdk
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git C:\plugin-sdk

      - name: Build latest premake from source
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/premake/premake-core.git C:\premake-src
          cd /d C:\premake-src
          nmake -f Bootstrap.mak MSDEV=vs2022 windows
          dir C:\premake-src\bin\release

      - name: Generate VS projects
        working-directory: C:\plugin-sdk\tools\premake
        run: |
          C:\premake-src\bin\release\premake5.exe vs2022
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem C:\plugin-sdk -Recurse -Filter *.vcxproj | ForEach-Object { $_.FullName }

      - name: Build plugin-sdk library (GTA SA)
        run: |
          $proj = Get-ChildItem C:\plugin-sdk -Recurse -Filter plugin_sa.vcxproj | Select-Object -First 1
          if (-not $proj) { Write-Host "plugin_sa.vcxproj not found"; exit 1 }
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Compile SkyMod.asi
        shell: pwsh
        run: |
          $lib = Get-ChildItem C:\plugin-sdk -Recurse -Filter plugin.lib | Select-Object -First 1
          if (-not $lib) { Get-ChildItem C:\plugin-sdk -Recurse -Filter *.lib | ForEach-Object { $_.FullName }; exit 1 }
          Write-Host "Using lib: $($lib.FullName)"
          $incDirs = @("C:\plugin-sdk\plugin_sa", "C:\plugin-sdk\shared", "C:\plugin-sdk\injector") |
            ForEach-Object { Get-ChildItem $_ -Recurse -Filter *.h -File } |
            ForEach-Object { $_.DirectoryName }
          $incDirs += "C:\plugin-sdk\plugin_sa", "C:\plugin-sdk\shared"
          $incArgs = $incDirs | Sort-Object -Unique | ForEach-Object { "/I$_" }
          $clArgs = @("/nologo","/LD","/EHsc","/MT","/O2","/std:c++latest",
                      "/DGTASA","/DPLUGIN_SGV_10US","/D_CRT_SECURE_NO_WARNINGS","/DNOMINMAX") +
                    $incArgs +
                    @("SkyMod.cpp","/Fe:SkyMod.asi","/link","/LIBPATH:$($lib.DirectoryName)","plugin.lib","user32.lib")
          & cl @clArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SkyMod
          path: SkyMod.asi
